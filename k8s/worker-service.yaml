apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: media
  labels:
    app: worker
spec:
  clusterIP: None
  selector: { app: worker }
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
