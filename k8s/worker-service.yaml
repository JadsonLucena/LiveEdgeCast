apiVersion: v1
kind: Service
metadata:
  name: rtmp-worker
  namespace: media
  labels:
    app: rtmp-worker
spec:
  clusterIP: None  # Headless service para DNS por pod
  selector: { app: rtmp-worker }
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9113
      targetPort: 9113
      protocol: TCP
