apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: media
spec:
  selector:
    matchLabels: { app: proxy }
  template:
    metadata:
      labels: { app: proxy }
    spec:
      serviceAccountName: liveedgecast-proxy
      automountServiceAccountToken: true
      containers:
        - name: nginx
          image: liveedgecast-proxy:latest
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TARGET_RTMP_URL
              valueFrom:
                secretKeyRef:
                  name: liveedgecast-target
                  key: rtmp-url
                  optional: true
          ports:
            - containerPort: 1935
              name: rtmp
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket: { port: 1935 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 1935 }
            initialDelaySeconds: 5
            periodSeconds: 10
