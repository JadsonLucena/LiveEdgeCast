apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtmp-proxy
  namespace: media
spec:
  # replicas removed - controlled by KEDA ScaledObject
  selector:
    matchLabels: { app: rtmp-proxy }
  template:
    metadata:
      labels: { app: rtmp-proxy }
    spec:
      containers:
        - name: nginx
          image: liveedgecast:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 1935
              name: rtmp
              protocol: TCP
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: cfg
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket: { port: 1935 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 1935 }
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: rtmp-stats-exporter
          image: python:3.11-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /tmp/rtmp_exporter.py << 'EXPORTER_EOF'
              #!/usr/bin/env python3
              import time, xml.etree.ElementTree as ET
              from http.server import HTTPServer, BaseHTTPRequestHandler
              import urllib.request, os
              
              RTMP_STATS_URL = 'http://localhost:8080/stats'
              EXPORTER_PORT = 9114
              
              class MetricsHandler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == '/metrics':
                          try:
                              with urllib.request.urlopen(RTMP_STATS_URL, timeout=5) as response:
                                  xml_data = response.read()
                              root = ET.fromstring(xml_data)
                              metrics = []
                              
                              # RTMP clients metric (THIS IS THE KEY METRIC!)
                              for server in root.findall('.//server/application'):
                                  app_name = server.find('name')
                                  if app_name is not None:
                                      app = app_name.text
                                      live = server.find('live')
                                      if live is not None:
                                          nclients = live.find('nclients')
                                          if nclients is not None:
                                              metrics.append('# HELP nginx_rtmp_live_clients Current number of RTMP live clients')
                                              metrics.append('# TYPE nginx_rtmp_live_clients gauge')
                                              metrics.append(f'nginx_rtmp_live_clients{{application="{app}"}} {nclients.text}')
                              
                              # Bandwidth metrics
                              bw_in = root.find('bw_in')
                              if bw_in is not None:
                                  metrics.append('# HELP nginx_rtmp_bandwidth_in_bytes_per_second Current inbound bandwidth')
                                  metrics.append('# TYPE nginx_rtmp_bandwidth_in_bytes_per_second gauge')
                                  metrics.append(f'nginx_rtmp_bandwidth_in_bytes_per_second {bw_in.text}')
                              
                              response_body = '\n'.join(metrics) + '\n'
                              self.send_response(200)
                              self.send_header('Content-Type', 'text/plain; version=0.0.4')
                              self.end_headers()
                              self.wfile.write(response_body.encode())
                          except Exception as e:
                              self.send_response(500)
                              self.end_headers()
                              self.wfile.write(f'Error: {str(e)}\n'.encode())
                      elif self.path == '/health':
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b'OK\n')
                      else:
                          self.send_response(404)
                          self.end_headers()
                  def log_message(self, format, *args):
                      if self.path != '/metrics': super().log_message(format, *args)
              
              HTTPServer(('0.0.0.0', EXPORTER_PORT), MetricsHandler).serve_forever()
              EXPORTER_EOF
              python3 /tmp/rtmp_exporter.py
          ports:
            - containerPort: 9114
              name: rtmp-metrics
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9114
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: cfg
          configMap: { name: rtmp-proxy-nginx-conf }
