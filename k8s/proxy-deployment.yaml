apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtmp-proxy
  namespace: media
spec:
  # replicas removed - controlled by KEDA ScaledObject
  selector:
    matchLabels: { app: rtmp-proxy }
  template:
    metadata:
      labels: { app: rtmp-proxy }
    spec:
      containers:
        - name: nginx
          image: liveedgecast-proxy:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 1935
              name: rtmp
              protocol: TCP
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket: { port: 1935 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 1935 }
            initialDelaySeconds: 5
            periodSeconds: 10
