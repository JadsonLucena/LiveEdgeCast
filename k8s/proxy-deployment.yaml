apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: media
spec:
  selector:
    matchLabels: { app: proxy }
  template:
    metadata:
      labels: { app: proxy }
    spec:
      containers:
        - name: nginx
          image: liveedgecast-proxy:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 1935
              name: rtmp
              protocol: TCP
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            # Reserve a 2 vCPU / 2 GiB proxy node budget for RTMP ingest and fan-out.
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            tcpSocket: { port: 1935 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 1935 }
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: nginx-prometheus-exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          args:
            - -nginx.scrape-uri=http://127.0.0.1:8080/nginx_status
            - -web.listen-address=:9113
          ports:
            - containerPort: 9113
              name: metrics
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
