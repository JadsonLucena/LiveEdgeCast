apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-scaler-script
  namespace: media
data:
  scaler.py: |
    #!/usr/bin/env python3
    import json
    import time
    import urllib.request
    import re
    from http.server import HTTPServer, BaseHTTPRequestHandler
    
    class ScalerHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/' or self.path == '/count':
                # Get RTMP stats from proxy
                try:
                    with urllib.request.urlopen('http://rtmp-proxy.media.svc.cluster.local:8080/stats') as response:
                        stats = response.read().decode('utf-8')
                    
                    # Parse nginx RTMP stats - look for active connections
                    connections = 0
                    if 'live' in stats and 'nclients' in stats:
                        # Extract number from nclients field
                        match = re.search(r'<nclients>(\d+)</nclients>', stats)
                        if match:
                            connections = int(match.group(1))
                    
                    # Return metric format
                    if self.path == '/count':
                        # Simple JSON for metrics-api
                        result = {"value": connections}
                        self.send_response(200)
                        self.send_header('Content-Type', 'application/json')
                        self.end_headers()
                        self.wfile.write(json.dumps(result).encode())
                    else:
                        # KEDA external scaler format
                        result = {
                            "metricValues": [{
                                "metricName": "rtmp_connections",
                                "metricValue": str(connections)
                            }]
                        }
                        self.send_response(200)
                        self.send_header('Content-Type', 'application/json')  
                        self.end_headers()
                        self.wfile.write(json.dumps(result).encode())
                    
                except Exception as e:
                    print(f"Error: {e}")
                    # Return 0 on error
                    if self.path == '/count':
                        result = {"value": 0}
                        self.send_response(200)
                        self.send_header('Content-Type', 'application/json')
                        self.end_headers()
                        self.wfile.write(json.dumps(result).encode())
                    else:
                        result = {
                            "metricValues": [{
                                "metricName": "rtmp_connections", 
                                "metricValue": "0"
                            }]
                        }
                        self.send_response(200)
                        self.send_header('Content-Type', 'application/json')
                        self.end_headers()
                        self.wfile.write(json.dumps(result).encode())
    
    if __name__ == "__main__":
        server = HTTPServer(('0.0.0.0', 8080), ScalerHandler)
        print("NGINX RTMP Scaler running on port 8080")
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-scaler
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-scaler
  template:
    metadata:
      labels:
        app: nginx-scaler
    spec:
      containers:
      - name: scaler
        image: python:3.9-slim
        command: ["python3", "/app/scaler.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: nginx-scaler-script
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-scaler
  namespace: media
spec:
  selector:
    app: nginx-scaler
  ports:
  - port: 8080
    targetPort: 8080