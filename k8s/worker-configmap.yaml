apiVersion: v1
kind: ConfigMap
metadata:
  name: rtmp-worker-nginx-conf
  namespace: media
data:
  nginx.conf: |
    worker_processes  auto;
    error_log /var/log/nginx/error.log debug;

    events {
        worker_connections  1024;
    }

    rtmp {
        server {
            listen 1935;
            chunk_size 4096;

            application live {
                live on;
                record off;

                allow publish all;
                deny play all;

                # Dynamic YouTube push configuration per stream
                # Script generates /tmp/worker_push_$name.conf with correct YouTube key
                exec_publish /scripts/on_worker_publish.sh $name;
                
                # Include dynamic push configuration (generated by exec_publish script)
                # Each stream gets its own push config file: /tmp/worker_push_<stream_name>.conf
                # Note: NGINX will error if no files match, but exec_publish creates it before streaming
                include /tmp/worker_push_*.conf;

                # Auto-terminate if idle
                drop_idle_publisher 300s;
            }
        }
    }

    http {
        include       mime.types;
        default_type  application/octet-stream;

        server {
            listen 8080;
        
            # Health check endpoint for Kubernetes probes
            location /health {
                return 200 'RTMP Worker is running.';
                add_header Content-Type text/plain;
            }

            # RTMP statistics endpoint (used by Controller for metrics check)
            location /stats {
                rtmp_stat all;
                rtmp_stat_stylesheet stat.xsl;
            }

            # Nginx status endpoint (used by nginx-prometheus-exporter)
            location /nginx_status {
                stub_status on;
                access_log off;
                allow all;
            }

            # Root endpoint for service identification
            location / {
                return 200 'LiveEdgeCast - RTMP Worker for Stream Processing';
                add_header Content-Type text/plain;
            }
        }
    }
