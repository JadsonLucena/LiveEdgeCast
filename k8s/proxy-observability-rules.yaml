apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: liveedgecast-proxy-observability
  namespace: monitoring
spec:
  groups:
    - name: liveedgecast.proxy.observability
      interval: 15s
      rules:
        - record: liveedgecast:proxy:cpu_percent
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="media",container!="",container!="POD",pod=~"proxy-.*",pod!~"proxy-lb-.*"}[1m]))
            /
            sum(container_spec_cpu_quota{namespace="media",container!="",container!="POD",pod=~"proxy-.*",pod!~"proxy-lb-.*"}/container_spec_cpu_period{namespace="media",container!="",container!="POD",pod=~"proxy-.*",pod!~"proxy-lb-.*"})
            * 100
        - record: liveedgecast:proxy:memory_percent
          expr: |
            sum(container_memory_working_set_bytes{namespace="media",container!="",container!="POD",pod=~"proxy-.*",pod!~"proxy-lb-.*"})
            /
            sum(container_spec_memory_limit_bytes{namespace="media",container!="",container!="POD",pod=~"proxy-.*",pod!~"proxy-lb-.*"})
            * 100
