apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtmp-controller
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels: { app: rtmp-controller }
  template:
    metadata:
      labels: { app: rtmp-controller }
    spec:
      serviceAccountName: default
      containers:
        - name: controller
          image: yourregistry/rtmp-controller:latest
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          readinessProbe:
            httpGet: { path: /allocate, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 3
