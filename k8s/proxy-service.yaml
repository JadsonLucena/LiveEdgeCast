apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: media
  labels:
    app: proxy
spec:
  type: ClusterIP
  selector: { app: proxy }
  sessionAffinity: None
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-headless
  namespace: media
  labels:
    app: proxy
spec:
  clusterIP: None
  selector: { app: proxy }
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
      protocol: TCP
