apiVersion: v1
kind: Service
metadata:
  name: rtmp-proxy
  namespace: media
  labels:
    app: rtmp-proxy
spec:
  type: ClusterIP
  selector: { app: rtmp-proxy }
  sessionAffinity: None
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9113
      targetPort: 9113
      protocol: TCP
---
# Headless Service for Pull-Only Architecture
# Enables pod-specific DNS: <pod-name>.rtmp-proxy-headless.media.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: rtmp-proxy-headless
  namespace: media
  labels:
    app: rtmp-proxy
spec:
  clusterIP: None  # Headless Service
  selector: { app: rtmp-proxy }
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
      protocol: TCP
