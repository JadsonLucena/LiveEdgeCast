apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: proxy-metrics
  namespace: monitoring
  annotations:
    # Documentation-only annotation for the observability contract; Prometheus
    # Operator does not use this key to change scrape behavior.
    liveedgecast.io/metrics-scope: "nginx-stub-status-only"
spec:
  namespaceSelector:
    matchNames: ["media"]
  selector:
    matchLabels:
      app: proxy
  endpoints:
    # nginx-prometheus-exporter scrapes /nginx_status and exposes generic NGINX
    # stub_status metrics. Simplified proxy verification focuses on CPU/memory
    # and controller stream/allocation state, not network traffic.
    - port: metrics
      interval: 10s
      path: /metrics
