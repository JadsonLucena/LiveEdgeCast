apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: proxy-metrics
  namespace: monitoring
  annotations:
    # Documentation-only annotations for the observability contract; Prometheus
    # Operator does not use these keys to change scrape behavior.
    liveedgecast.io/metrics-scope: "nginx-stub-status-only"
    liveedgecast.io/rtmp-traffic-source: "cadvisor-pod-network-counters"
spec:
  namespaceSelector:
    matchNames: ["media"]
  selector:
    matchLabels:
      app: proxy
  endpoints:
    # nginx-prometheus-exporter scrapes /nginx_status and exposes generic NGINX
    # stub_status metrics. RTMP byte-rate dashboards intentionally use cAdvisor
    # Pod network counters because current controller metrics from /stats publish
    # activity counts, not RTMP byte counters.
    - port: metrics
      interval: 10s
      path: /metrics
