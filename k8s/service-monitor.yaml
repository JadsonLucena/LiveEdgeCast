apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rtmp-worker-metrics
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["media"]
  selector:
    matchLabels:
      app: rtmp-worker
  endpoints:
    - port: metrics
      interval: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rtmp-proxy-metrics
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["media"]
  selector:
    matchLabels:
      app: rtmp-proxy
  endpoints:
    - port: rtmp-metrics
      interval: 10s
      path: /metrics
