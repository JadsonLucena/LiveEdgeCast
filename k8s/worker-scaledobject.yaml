apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rtmp-worker-scaler
  namespace: media
spec:
  scaleTargetRef:
    kind: Deployment
    name: rtmp-worker
  minReplicaCount: 0    # True serverless - starts with 0 replicas
  maxReplicaCount: 100  # Scale up to handle multiple streams
  cooldownPeriod: 300   # 5min cleanup after inactivity
  pollingInterval: 10   # Check every 10 seconds
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0  # Immediate scale up
          selectPolicy: Max
          policies:
          - type: Percent
            value: 100
            periodSeconds: 10
        scaleDown:
          stabilizationWindowSeconds: 60  # Wait 1min before scale down
          selectPolicy: Min
          policies:
          - type: Percent
            value: 50
            periodSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.prometheus.svc.cluster.local:80
        metricName: rtmp_tcp_connections
        # Scale based on TCP connections to RTMP port (1935) on PROXY
        # Each TCP connection = 1 publisher sending a stream
        # Workers scale 1:1 with publishers (1 worker per stream)
        query: |
          sum(nginx_rtmp_tcp_connections{namespace="media",pod=~"rtmp-proxy-.*",port="1935"}) or vector(0)
        threshold: "1"  # Scale up 1 worker per TCP connection (1:1 mapping)
        activationThreshold: "0.5"  # Wake up from 0 replicas when >= 1 connection exists
