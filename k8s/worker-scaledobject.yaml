# IMPORTANTE: KEDA ScaledObject para workers DESABILITADO
# O Controller Python é a ÚNICA fonte da verdade para scale-up de workers
# Isso previne conflitos e race conditions no escalonamento
#
# O Controller gerencia workers diretamente via .spec.replicas no Deployment
# mantendo controle total sobre alocação 1:1 (stream → worker)
#
# Se você quiser reabilitar KEDA para scale-down automático baseado em métricas,
# descomente abaixo e ajuste apenas os triggers de scale-down, NUNCA scale-up.

# apiVersion: keda.sh/v1alpha1
