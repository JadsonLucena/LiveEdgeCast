# spec:
#   scaleTargetRef:
#     kind: Deployment
#     name: rtmp-worker
#   minReplicaCount: 0
#   maxReplicaCount: 100
#   cooldownPeriod: 300
#   pollingInterval: 10
#   advanced:
#     horizontalPodAutoscalerConfig:
#       behavior:
#         scaleDown:
#           stabilizationWindowSeconds: 300
#           selectPolicy: Min
#           policies:
#           - type: Percent
#             value: 50
#             periodSeconds: 60
#   triggers:
