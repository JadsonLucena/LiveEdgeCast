apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rtmp-worker-scaler
  namespace: media
spec:
  scaleTargetRef:
    kind: Deployment
    name: rtmp-worker
  minReplicaCount: 0    # True serverless - starts with 0 replicas
  maxReplicaCount: 100  # Scale up to handle multiple streams
  cooldownPeriod: 300   # 5min cleanup after inactivity
  pollingInterval: 10   # Check every 10 seconds
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0  # Immediate scale up
          selectPolicy: Max
          policies:
          - type: Percent
            value: 100
            periodSeconds: 10
        scaleDown:
          stabilizationWindowSeconds: 60  # Wait 1min before scale down
          selectPolicy: Min
          policies:
          - type: Percent
            value: 50
            periodSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: rtmp_live_clients
        # Scale based on ACTUAL RTMP clients connected (not HTTP connections!)
        # This metric comes from nginx-rtmp /stats endpoint: <nclients>N</nclients>
        # Only counts real RTMP handshake connections, not HTTP monitoring
        query: |
          sum(nginx_rtmp_live_clients{namespace="media",application="live"}) or vector(0)
        threshold: "1"  # Scale up when there's at least 1 RTMP client
