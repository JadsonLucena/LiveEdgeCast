apiVersion: v1
kind: ConfigMap
metadata:
  name: rtmp-proxy-nginx-conf
  namespace: media
data:
  nginx.conf: |
    user root;
    worker_processes  auto;
    error_log /var/log/nginx/error.log debug;

    events {
        worker_connections  1024;
    }

    rtmp {
        server {
            listen 1935;
            chunk_size 4096;

            application live {
                live on;
                record off;

                allow publish all;

                # Multi-stream support via individual ffmpeg processes
                # Each stream gets its own ffmpeg process routing to dedicated worker
                exec_publish /scripts/on_publish_start.sh $name;
                exec_publish_done /scripts/on_publish_done.sh $name;
            }
        }
    }

    http {
        include       mime.types;
        default_type  application/octet-stream;

        server {
            listen 8080;

            # Health check endpoint for Kubernetes probes
            location /health {
                return 200 'RTMP Edge Proxy is running.';
                add_header Content-Type text/plain;
            }

            # RTMP statistics endpoint (used by rtmp-stats-exporter for Prometheus metrics)
            location /stats {
                rtmp_stat all;
                rtmp_stat_stylesheet stat.xsl;
            }

            # Root endpoint for service identification
            location / {
                return 200 'LiveEdgeCast - RTMP Edge Proxy for Multi-Stream Retransmission';
                add_header Content-Type text/plain;
            }
        }
    }
