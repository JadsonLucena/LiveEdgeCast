apiVersion: v1
kind: ConfigMap
metadata:
  name: rtmp-proxy-nginx-conf
  namespace: media
data:
  nginx.conf: |
    worker_processes  auto;

    events {
        worker_connections  1024;
    }

    rtmp {
        server {
            listen 1935;
            chunk_size 4096;

            application live {
                live on;
                record off;

                allow publish all;

                include /tmp/dynamic_push.conf;

                # Quando o cliente publica, rodamos o script
                exec_publish /scripts/allocate_worker.sh $name;
            }
        }
    }

    http {
        include       mime.types;
        default_type  application/octet-stream;

        server {
            listen 8080;

            # Health check endpoint for Kubernetes probes
            location /health {
                return 200 'RTMP Edge Proxy is running.';
                add_header Content-Type text/plain;
            }

            # RTMP statistics endpoint (used by rtmp-stats-exporter for Prometheus metrics)
            location /stats {
                rtmp_stat all;
                rtmp_stat_stylesheet stat.xsl;
            }

            # Root endpoint for service identification
            location / {
                return 200 'LiveEdgeCast - RTMP Edge Proxy for Low-Latency Stream Retransmission';
                add_header Content-Type text/plain;
            }
        }
    }
  allocate_worker.sh: |
    #!/bin/sh
    STREAM_NAME="$1"
    API="http://rtmp-controller.media.svc.cluster.local:8000/allocate"
    echo "Allocating worker for stream: $STREAM_NAME"

    WORKER=$(wget -qO- $API | jq -r .pod)

    while [ "$WORKER" = "null" ] || [ -z "$WORKER" ]; do
      echo "Waiting worker start..."
      sleep 1
      WORKER=$(wget -qO- $API | jq -r .pod)
    done

    echo "Worker ready: $WORKER"
    echo "push rtmp://$WORKER/live;" > /tmp/dynamic_push.conf
    exit 0
