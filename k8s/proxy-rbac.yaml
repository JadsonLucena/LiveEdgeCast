apiVersion: v1
kind: ServiceAccount
metadata:
  name: liveedgecast-proxy
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: liveedgecast-proxy
  namespace: media
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - liveedgecast-target
      - liveedgecast-stream-keys
    verbs:
      - get
  - apiGroups:
      - liveedgecast.io
    resources:
      - livestreams
    verbs:
      - get
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liveedgecast-proxy
  namespace: media
subjects:
  - kind: ServiceAccount
    name: liveedgecast-proxy
    namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: liveedgecast-proxy
