apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rtmp-worker-scaler
  namespace: media
spec:
  scaleTargetRef:
    kind: Deployment
    name: rtmp-worker
  minReplicaCount: 0    # True serverless - starts with 0 replicas
  maxReplicaCount: 5    # Scale up to handle multiple streams  
  cooldownPeriod: 120   # 2min cleanup after inactivity
  pollingInterval: 10   # Check every 10 seconds
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0  # Immediate scale up
          selectPolicy: Max
          policies:
          - type: Percent
            value: 100
            periodSeconds: 10
        scaleDown:
          stabilizationWindowSeconds: 60  # Wait 1min before scale down
          selectPolicy: Min
          policies:
          - type: Percent
            value: 100
            periodSeconds: 60
  triggers:
    # Monitor proxy resource usage - when RTMP stream arrives, usage increases
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: proxy_cpu_usage
        threshold: '0.01'  # Very low threshold - 1% CPU
        # Query for proxy pod CPU usage
        query: |
          sum(rate(container_cpu_usage_seconds_total{namespace="media",pod=~"rtmp-proxy-.*",container="nginx"}[1m])) or vector(0)