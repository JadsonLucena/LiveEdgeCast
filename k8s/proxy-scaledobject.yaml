apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rtmp-proxy-scaler
  namespace: media
spec:
  scaleTargetRef:
    kind: Deployment
    name: rtmp-proxy
  minReplicaCount: 1     # Sempre pelo menos 1 proxy ativo
  maxReplicaCount: 10    # Máximo 10 proxies para balancear carga
  cooldownPeriod: 300    # 5min para scale down (maior que worker)
  pollingInterval: 10    # Verifica a cada 10 segundos
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30  # Aguarda 30s antes de escalar
          selectPolicy: Max
          policies:
          - type: Percent
            value: 100
            periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 420  # Aguarda 7min antes de reduzir
          selectPolicy: Min
          policies:
          - type: Percent
            value: 25
            periodSeconds: 60
  triggers:
    # Primary Trigger: Escalação baseada em tráfego inbound (métricas Kubernetes nativas)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.prometheus.svc.cluster.local:80
        metricName: rtmp_proxy_inbound_mbps
        query: |
          sum(rate(container_network_receive_bytes_total{namespace="media",pod=~"rtmp-proxy-.*"}[1m])) / (1000*1000) or vector(0)
        threshold: "800"  # Scale quando > 800Mbps de tráfego de entrada
    
    # Secondary Trigger: CPU como safety net (métricas Kubernetes nativas)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.prometheus.svc.cluster.local:80
        metricName: rtmp_proxy_cpu_usage
        query: |
          sum(rate(container_cpu_usage_seconds_total{namespace="media",pod=~"rtmp-proxy-.*"}[1m])) / sum(container_spec_cpu_quota{namespace="media",pod=~"rtmp-proxy-.*"}/container_spec_cpu_period{namespace="media",pod=~"rtmp-proxy-.*"}) * 100 or vector(0)
        threshold: "80"  # Safety net: Escala quando CPU > 80%
    
    # Tertiary Trigger: Memória como safety net adicional (métricas Kubernetes nativas)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.prometheus.svc.cluster.local:80
        metricName: rtmp_proxy_memory_usage
        query: |
          sum(container_memory_working_set_bytes{namespace="media",pod=~"rtmp-proxy-.*"}) / sum(container_spec_memory_limit_bytes{namespace="media",pod=~"rtmp-proxy-.*"}) * 100 or vector(0)
        threshold: "80"  # Safety net: Escala quando memória > 80%