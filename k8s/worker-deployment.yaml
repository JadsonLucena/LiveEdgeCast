apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: media
spec:
  replicas: 0
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: rtmp
          image: liveedgecast-worker:latest
          imagePullPolicy: Never
          env:
            - name: RTMP_PUSH_BASE_URL
              value: "rtmp://mediaserver.eadmeeting.com/LiveApp"
          ports:
            - containerPort: 1935
              name: rtmp
              protocol: TCP
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9113
              name: metrics
              protocol: TCP
          resources:
            # Workers now transcode each live stream to H.264/AAC instead of
            # copying codecs. Reserve a practical minimum for one live
            # transcode while still allowing CPU burst for higher resolutions.
            requests:
              memory: "1Gi"
              cpu: "2000m"
            limits:
              memory: "2Gi"
              cpu: "4000m"
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
