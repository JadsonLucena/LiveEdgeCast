worker_processes  auto;
error_log /var/log/nginx/error.log debug;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            allow publish 127.0.0.1;
            deny publish all;

            allow play all;


            drop_idle_publisher 60s;
        }
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;

        location /health {
            root /;
            try_files /tmp/worker-health =503;
            add_header Cache-Control no-store;
            default_type text/plain;
        }

        location /health-meta {
            root /;
            try_files /tmp/worker-health-meta =503;
            add_header Cache-Control no-store;
            default_type text/plain;
        }

        location /stats {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location / {
            return 200 'LiveEdgeCast - RTMP Worker for Stream Processing';
            add_header Content-Type text/plain;
        }
    }
}
