worker_processes  auto;
error_log /var/log/nginx/error.log debug;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Pull-Only: Worker não recebe publish externo
            # FFmpeg interno publica apenas para validação de stream
            allow publish 127.0.0.1;
            deny publish all;

            # Allow play from anywhere (not used in Pull-Only)
            allow play all;

            # Não usa exec_publish - worker inicia via HTTP do controller
            # Script on_worker_publish_push.sh é chamado diretamente

            # Auto-terminate if idle
            drop_idle_publisher 60s;
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;

        # Health check endpoint for Kubernetes probes
        location /health {
            return 200 'RTMP Worker is running.';
            add_header Content-Type text/plain;
        }

        # RTMP statistics endpoint (used by Controller for metrics check)
        location /stats {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        # Nginx status endpoint (used by nginx-prometheus-exporter)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        # Root endpoint for service identification
        location / {
            return 200 'LiveEdgeCast - RTMP Worker for Stream Processing';
            add_header Content-Type text/plain;
        }
    }
}
