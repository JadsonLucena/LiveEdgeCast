user root;
worker_processes  auto;
error_log /var/log/nginx/error.log debug;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Accept publish from external sources
            allow publish all;

            # Allow play for workers to pull streams (Pull-Only architecture)
            allow play all;

            # Auto-disconnect idle publishers (workers drop after 5min)
            drop_idle_publisher 60s;  # 1min

            # Notify controller when stream starts/stops
            # Controller orchestrates worker allocation
            # Worker pulls from proxy and pushes to YouTube
            exec_publish /scripts/on_publish_start.sh $name;
            exec_publish_done /scripts/on_publish_done.sh $name;
        }
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;

        # Health check endpoint for Kubernetes probes
        location /health {
            return 200 'RTMP Edge Proxy is running.';
            add_header Content-Type text/plain;
        }

        # RTMP statistics endpoint (used by rtmp-stats-exporter for Prometheus metrics)
        location /stats {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        # Nginx status endpoint (used by nginx-prometheus-exporter)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        # Root endpoint for service identification
        location / {
            return 200 'LiveEdgeCast - RTMP Edge Proxy for Multi-Stream Retransmission';
            add_header Content-Type text/plain;
        }
    }
}
