user root;
worker_processes  auto;
error_log /var/log/nginx/error.log debug;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            allow publish all;

            allow play all;

            drop_idle_publisher 60s;

            # clientid is the NGINX connection number added to the RTMP
            # evaluator at image build time, so both lifecycle events receive
            # the same publication identity even across overlapping reconnects.
            exec_publish /scripts/publication_started.sh $name $app $addr $clientid;
            exec_publish_done /scripts/publication_ended.sh $name $app $addr $clientid;
        }
    }
}
