user root;
worker_processes  auto;
error_log /var/log/nginx/error.log debug;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            allow publish all;

            allow play all;

            drop_idle_publisher 60s;

            # The exec module exposes the stream name and peer address for both
            # lifecycle events. Pass the same connection identity to each hook
            # so its locally persisted Kubernetes session can be correlated.
            exec_publish /scripts/publication_started.sh $name $addr;
            exec_publish_done /scripts/publication_ended.sh $name $addr;
        }
    }
}
