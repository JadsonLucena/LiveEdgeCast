user root;
worker_processes  auto;
error_log /var/log/nginx/error.log debug;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            allow publish all;

            allow play all;

            drop_idle_publisher 60s;

            # The notify module includes name, app, addr, and its native
            # connection-number clientid in both callbacks. on_publish blocks
            # admission and rejects the RTMP publication on a non-2xx response.
            notify_method post;
            on_publish http://127.0.0.1:18080/lifecycle;
            on_publish_done http://127.0.0.1:18080/lifecycle;
        }
    }
}
