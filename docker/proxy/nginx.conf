user root;
worker_processes  auto;
error_log /var/log/nginx/error.log debug;

# nginx clears inherited variables unless they are explicitly preserved.
env POD_NAME;
env POD_IP;
env POD_NAMESPACE;
env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin;
env RTMP_TARGET_BASE_URL;
env KUBERNETES_SERVICE_HOST;
env KUBERNETES_SERVICE_PORT_HTTPS;
env KUBERNETES_SERVICEACCOUNT_DIR;
env KUBERNETES_API_CONNECT_TIMEOUT_SECONDS;
env KUBERNETES_API_REQUEST_TIMEOUT_SECONDS;
env NGINX_LIFETIME_ID;
env PUBLICATION_STATE_DIR;
env TERMINATION_RETRY_SECONDS;
env TERMINATION_WAIT_ATTEMPTS;
env SOURCE_UPDATE_ATTEMPTS;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            allow publish all;

            allow play all;

            drop_idle_publisher 60s;

            # Admission remains synchronous: a non-2xx response prevents nginx
            # from accepting a publication whose Kubernetes registration failed.
            notify_method post;
            on_publish http://127.0.0.1:18080/lifecycle;
            on_publish_done http://127.0.0.1:18080/lifecycle;

            # The local exec-module patch exposes nginx's monotonically assigned
            # connection number, the same value sent as notify's clientid.
            # respawn is disabled because these are finite lifecycle commands.
            respawn off;
            exec_publish /scripts/publication_started.sh $name $clientid;
            exec_publish_done /scripts/publication_ended.sh $name $clientid;
        }
    }
}
