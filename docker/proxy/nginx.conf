user root;
worker_processes  auto;
error_log /var/log/nginx/error.log debug;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            allow publish all;

            allow play all;

            drop_idle_publisher 60s;

            exec_publish /scripts/on_publish_start.sh $name;
            exec_publish_done /scripts/on_publish_done.sh $name;
        }
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;

        location /health {
            return 200 'RTMP Edge Proxy is running.';
            add_header Content-Type text/plain;
        }

        location /stats {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location / {
            return 200 'LiveEdgeCast - RTMP Edge Proxy for Multi-Stream Retransmission';
            add_header Content-Type text/plain;
        }
    }
}
